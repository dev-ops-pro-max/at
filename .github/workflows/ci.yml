name: Validate platform
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run build
      - run: node scripts/build-app-support.mjs
      - run: node --check dist/app-support.mjs
      - run: npm run check
      - run: npm test
