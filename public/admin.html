<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Staff dashboard | Amaravathi Travels</title><link rel="stylesheet" href="/styles.css"><script type="module" src="/admin.js"></script><link rel="icon" type="image/png" sizes="48x48" href="/favicon.png?v=20261103"><link rel="apple-touch-icon" href="/favicon.png?v=20261103"></head><body><main class="wrap admin-layout"><header class="admin-header"><div><p class="eyebrow">AMARAVATHI TRAVELS · STAFF</p><h1>Enquiries & operations</h1></div><div><a href="/">Website ↗</a> · <a href="/cdn-cgi/access/logout">Sign out</a></div></header><div class="admin-tabs"><button class="btn primary" id="enquiries-tab">Enquiries</button><button class="btn" id="catalog-tab">Fleet & packages</button></div><p id="admin-status" class="admin-status" role="status" aria-live="polite"></p><section id="enquiries-panel"><div class="admin-tools"><label>Search name, phone or reference<input id="search" type="search" maxlength="100"></label><label>Status<select id="status-filter"><option value="">All statuses</option><option>New</option><option>Quoted</option><option>Confirmed</option><option>In progress</option><option>Completed</option><option>Cancelled</option></select></label><button class="btn primary" id="refresh">Search / refresh</button><button class="btn" id="export">Export displayed rows</button></div><div id="enquiries"></div><button class="btn" id="next" hidden>Next page →</button></section><section id="catalog-panel" hidden><label>Choose an item<select id="catalog-select"></select></label><button class="btn" id="new-item">Add vehicle / package</button><form id="catalog-form" class="admin-card catalog-editor"><label>Unique ID (lowercase letters, numbers, hyphens)<input name="id" required pattern="[a-z0-9-]{1,50}" maxlength="50"></label><label>Type<select name="kind"><option value="vehicle">Vehicle category</option><option value="package">Package</option></select></label><label>Title<input name="title" required maxlength="100"></label><label>Description<textarea name="description" required maxlength="1000"></textarea></label><label>Seating / itinerary / inclusions<textarea name="details" maxlength="500"></textarea></label><label>Approved price or quotation text<input name="price" required maxlength="120" value="Quote on request"></label><label class="consent"><input name="published" type="checkbox" checked> Publish on website</label><p class="fine-print">Current images are category illustrations. Publish only verified service and pricing information.</p><button type="submit" class="btn primary">Save item</button></form></section></main></body></html>
